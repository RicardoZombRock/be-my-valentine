<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="hearts" id="hearts"></div>

  <div class="container">
    <div class="scene">
      <div class="card" id="card">

        <!-- FRONT -->
        <div class="card-face front">
          <h1>💖 Be My Valentine 💖</h1>
          <p>¿Mi amorcito hermosa, te gustaría ser mi San Valentín?</p>

          <div class="buttons">
            <button id="yesBtn">Sí 💕</button>
            <button id="noBtn">No 🙈</button>
          </div>
        </div>

        <!-- BACK -->
        <div class="card-face back">
          <div class="back-button" id="backBtn">←</div>

          <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif" class="penguin" alt="Pingüinos enamorados" />

          <h2>💘 Yeiiih!!! Dijiste que sí 💘</h2>
          <p>Viviremos muchos momentos juntos… Te amo ✨</p>

          <div class="gallery">
            <div class="photo">
              <img src="./img/1.jpg" alt="Foto 1">
            </div>
            <div class="photo">
              <img src="./img/2.jpg" alt="Foto 2">
            </div>
            <div class="photo">
              <img src="./img/3.jpg" alt="Foto 3">
            </div>
            <div class="photo">
              <img src="./img/4.jpg" alt="Foto 4">
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>

</html>
